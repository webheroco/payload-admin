name: Publish

# A merge to main that raises the version in package.json makes a GitHub
# release, vX.Y.Z, with the built package attached. Sites install that file
# by its URL (see README), so no registry and no token.
on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Is this version new?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        run: npm ci && npm run typecheck && npm run build && npm test
      - if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(npm pack --silent)
          gh release create "v${{ steps.version.outputs.version }}" "$FILE" \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "Install: npm install --save-exact https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/$FILE"
